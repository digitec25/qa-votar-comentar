name: QA Tests & Dashboard


on:
  push:
    branches: [ main ]
  workflow_dispatch:   

permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas (no detiene el flujo si hay fallos)
        continue-on-error: true
        env:
          HEADLESS: "1"
          BUGGY_USER: ${{ secrets.BUGGY_USER }}
          BUGGY_PASS: ${{ secrets.BUGGY_PASS }}
        run: |
          py.test test_votar_comentar.py -v \
            --html=reporte.html --self-contained-html \
            --json-report --json-report-file=reporte.json || true

      - name: Generar el dashboard (sitio)
        run: python generar_dashboard.py

      - name: Copiar reporte HTML dentro del sitio
        run: |
          cp -f reporte.html sitio/reporte.html || true

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
